<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tree Encyclopedia - Botanical Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #00d4ff;
            --bg-dark: #050a09;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 212, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { 
            background: #222; 
            border-radius: 10px;
            border: 2px solid #0a0a0a;
        }
        ::-webkit-scrollbar-thumb:hover { background: #333; }

        header {
            padding: 60px 20px 40px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-dim);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #searchInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .tree-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .tree-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .tree-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 255, 136, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .image-preview {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tree-card:hover .image-preview img {
            transform: scale(1.1);
        }

        .tree-info {
            padding: 15px 10px 5px;
        }

        .tree-info h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: white;
        }

        .tree-info .id-badge {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--primary);
            background: rgba(0, 255, 136, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        .modal-content {
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .modal-header h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, white, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #ff3366;
            transform: rotate(90deg);
        }

        .image-viewer {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            overflow-y: auto;
            padding: 10px;
            touch-action: none; /* Disable default browser touch actions for custom zoom */
        }

        .zoom-container {
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zoomable {
            width: 100%;
            height: auto;
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            touch-action: none;
            cursor: zoom-in;
        }

        .image-viewer img {
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2.5rem; }
            .image-viewer { grid-template-columns: 1fr; }
            .modal-content { height: 95vh; }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tree-card {
            animation: fadeIn 0.6s backwards;
        }
    </style>
</head>
<body>

<header>
    <h1>Botanical Archive</h1>
    <p>우리 땅에서 자라는 소중한 나무 188종을<br>고해상도 도감 이미지로 만나보세요.</p>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="나무 이름을 검색하세요 (예: 소나무, 은행나무...)">
    </div>
</header>

<div class="main-container">
    <div class="tree-grid" id="treeGrid">
        <!-- Trees will be generated here -->
    </div>
</div>

<div class="modal" id="imageModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Tree Name</h2>
            <button class="close-btn" id="closeModal">&times;</button>
        </div>
        <div class="image-viewer" id="imageViewer">
            <!-- Images will be loaded here -->
        </div>
    </div>
</div>

<script>
    const treeList = [
        "소철", "은행나무", "전나무", "구상나무", "솔송나무", "독일가문비", "잣나무", "소나무", "소나무속 나무의 비교", "일본잎갈나무", 
        "개잎갈나무", "메타세쿼이아", "삼나무", "측백나무", "편백", "향나무", "비자나무", "주목", "오미자", "붓순나무", 
        "등칡", "자주받침꽃", "생강나무", "비목나무", "녹나무", "후박나무", "백목련", "함박꽃나무", "일본목련", "태산목", 
        "튤립나무", "청미래덩굴", "종려나무", "야자나무 종류의 비교", "매자나무", "매발톱나무", "으름덩굴", "멀꿀", "종덩굴", "버드나무_84", 
        "회양목", "계수나무", "굴거리나무", "까마귀밥여름나무", "조록나무", "히어리", "모란", "개머루", "담쟁이덩굴", "사철나무", 
        "화살나무", "산나물로 먹는 나무", "회나무", "노박덩굴", "예덕나무", "사람주나무", "유동", "망종화", "버드나무_122", "은사시나무", 
        "사시나무속 나무의 비교", "황철나무", "버드나무_128", "갯버들", "자귀나무", "박태기나무", "칡", "골담초", "아까시나무", "등", 
        "족제비싸리", "싸리", "회화나무", "다릅나무", "오리나무", "사방오리", "박달나무", "자작나무", "자작나무속 나무의 비교", "물박달나무", 
        "개암나무", "서어나무", "밤나무", "구실잣밤나무", "상수리나무", "참나무속 나무의 비교", "굴참나무", "가시나무", "굴피나무", "중국굴피나무", 
        "가래나무", "소귀나무", "팽나무", "보리수나무", "꾸지뽕나무_188", "닥나무", "산뽕나무_192", "천선과나무", "무화과", "대추나무", 
        "갯대추나무", "가침박달", "조팝나무", "조팝나무속 나무의 비교", "국수나무", "매실나무", "살구나무", "복숭아나무", "왕벚나무", "앵두나무", 
        "찔레꽃", "해당화", "산딸기", "산딸기속 나무의 비교", "뱀딸기", "황매화", "비파나무", "다정큼나무", "모과나무", "사과나무", 
        "산사나무", "아그배나무", "콩배나무", "팥배나무", "마가목", "윤노리나무", "병아리꽃나무", "명자나무", "풀명자", "쉬땅나무", 
        "느릅나무", "느티나무", "시무나무", "참느릅나무", "뽕나무", "산뽕나무_270", "꾸지뽕나무_272", "무궁화", "부용", "피나무", 
        "삼지닥나무", "고로쇠나무", "단풍나무", "단풍나무속 나무의 비교", "당단풍나무", "신나무", "가죽나무", "소태나무", "겨우살이", "산딸나무", 
        "산수유", "층층나무", "층층나무속 나무의 비교", "매발톱나무_302", "수국", "산수국", "다래", "산에서 따 먹는 열매", "개다래", "감나무", 
        "철쭉", "진달래", "정금나무", "사스레피나무", "자금우", "쪽동백나무", "노린재나무", "동백나무", "노각나무", "차나무", 
        "두충", "마삭줄", "치자나무", "구슬꽃나무", "계요등", "능소화", "개오동", "작살나무", "층꽃나무", "누리장나무", 
        "순비기나무", "물푸레나무", "들메나무", "미선나무", "개나리", "우리나라에서만 자생하는 특산나무", "라일락", "이팝나무", "쥐똥나무", "참오동", 
        "구기자나무", "감탕나무", "먼나무", "호랑가시나무", "딱총나무", "가막살나무", "분꽃나무", "백당나무", "댕강나무", "병꽃나무", 
        "괴불나무", "인동덩굴", "송악", "팔손이", "황칠나무", "오갈피나무", "돈나무"
    ];

    const grid = document.getElementById('treeGrid');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('imageModal');
    const closeModal = document.getElementById('closeModal');

    function createCard(name, index) {
        const card = document.createElement('div');
        card.className = 'tree-card';
        card.style.animationDelay = `${(index % 20) * 0.05}s`;
        
        card.innerHTML = `
            <div class="image-preview">
                <img src="assets/trees/${name}_1.jpg" alt="${name}" loading="lazy">
            </div>
            <div class="tree-info">
                <span class="id-badge">No. ${String(index + 1).padStart(3, '0')}</span>
                <h3>${name}</h3>
            </div>
        `;

        card.addEventListener('click', () => openModal(name));
        return card;
    }

    function renderTrees(filter = '') {
        grid.innerHTML = '';
        treeList.forEach((name, index) => {
            if (name.includes(filter)) {
                grid.appendChild(createCard(name, index));
            }
        });
    }

    function openModal(name) {
        document.getElementById('modalTitle').innerText = name;
        const viewer = document.getElementById('imageViewer');
        viewer.innerHTML = `
            <div class="zoom-container"><img src="assets/trees/${name}_1.jpg" alt="${name} 1" class="zoomable"></div>
            <div class="zoom-container"><img src="assets/trees/${name}_2.jpg" alt="${name} 2" class="zoomable"></div>
        `;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        initZoom();
    }

    function initZoom() {
        const zoomables = document.querySelectorAll('.zoomable');
        
        zoomables.forEach(img => {
            let scale = 1;
            let lastScale = 1;
            let startDist = 0;
            let posX = 0, posY = 0;
            let lastPosX = 0, lastPosY = 0;
            let startX = 0, startY = 0;
            let isDragging = false;

            img.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    startDist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                } else if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].pageX - posX;
                    startY = e.touches[0].pageY - posY;
                }
            });

            img.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    scale = Math.min(Math.max(1, lastScale * (dist / startDist)), 4);
                    updateTransform();
                } else if (e.touches.length === 1 && isDragging && scale > 1) {
                    e.preventDefault();
                    posX = e.touches[0].pageX - startX;
                    posY = e.touches[0].pageY - startY;
                    updateTransform();
                }
            });

            img.addEventListener('touchend', (e) => {
                lastScale = scale;
                isDragging = false;
                if (scale <= 1) {
                    posX = 0;
                    posY = 0;
                    updateTransform();
                }
            });

            function updateTransform() {
                img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
            }

            // Double tap to reset
            let lastTap = 0;
            img.addEventListener('click', (e) => {
                const now = new Date().getTime();
                if (now - lastTap < 300) {
                    scale = scale > 1 ? 1 : 2;
                    lastScale = scale;
                    posX = 0; posY = 0;
                    updateTransform();
                }
                lastTap = now;
            });
        });
    }

    closeModal.addEventListener('click', () => {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal.click();
    });

    searchInput.addEventListener('input', (e) => {
        renderTrees(e.target.value);
    });

    // Initial Render
    renderTrees();
</script>

</body>
</html>
